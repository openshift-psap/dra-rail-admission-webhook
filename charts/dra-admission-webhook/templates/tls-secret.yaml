{{- if eq .Values.tls.mode "helm-generated" }}
{{- $certs := include "dra-admission-webhook.tlsCerts" . | fromJson }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dra-admission-webhook.tlsSecretName" . }}
  namespace: {{ include "dra-admission-webhook.namespace" . }}
  labels:
    {{- include "dra-admission-webhook.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $certs.crt | b64enc }}
  tls.key: {{ $certs.key | b64enc }}
  ca.crt: {{ $certs.ca | b64enc }}
{{- end }}
