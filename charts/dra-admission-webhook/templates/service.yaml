apiVersion: v1
kind: Service
metadata:
  name: {{ include "dra-admission-webhook.serviceName" . }}
  namespace: {{ include "dra-admission-webhook.namespace" . }}
  labels:
    {{- include "dra-admission-webhook.webhookLabels" . | nindent 4 }}
spec:
  selector:
    {{- include "dra-admission-webhook.webhookSelectorLabels" . | nindent 4 }}
  ports:
  - port: 443
    targetPort: {{ .Values.webhook.port }}
    protocol: TCP
    name: https
