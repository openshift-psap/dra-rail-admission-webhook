# PSAP RDU4 B200 cluster — Ethernet with CIDRPool-based VF IP assignment
webhook:
  replicas: 1

webhookPvc:
  enabled: true
  storageClassName: ""
  size: 100Mi

webhookConfig:
  transportMode: ethernet
  maxPairsPerNUMA: 4
  maxPairsPerNode: 8
  gpuDeviceClassName: gpu.nvidia.com
  nicDeviceClassName: dranet
  preflightCheck: false
  nicConfig:
    mtu: 9000
    rdmaRequired: true
    interfacePrefix: "net"
    startingTableId: 100
    crossRailCIDR: "172.16.0.0/12"
    deviceType: vf
    includeDevices:
      encapsulations:
        - "ether"
    gatewayResolution:
      mode: cidrpool
      cidrPoolConfig:
        refreshInterval: "60s"
        pools:
          - name: cidr-rail0
            namespace: nvidia-network-operator
            railIndex: 0
          - name: cidr-rail1
            namespace: nvidia-network-operator
            railIndex: 1
          - name: cidr-rail2
            namespace: nvidia-network-operator
            railIndex: 2
          - name: cidr-rail3
            namespace: nvidia-network-operator
            railIndex: 3
          - name: cidr-rail4
            namespace: nvidia-network-operator
            railIndex: 4
          - name: cidr-rail5
            namespace: nvidia-network-operator
            railIndex: 5
          - name: cidr-rail6
            namespace: nvidia-network-operator
            railIndex: 6
          - name: cidr-rail7
            namespace: nvidia-network-operator
            railIndex: 7
    rails:
      - subnet: "172.16.0.0/16"
        gateway: ""
        ipv4Prefix: "172.16."
        pciAddressPrefix: "0000:18:"
      - subnet: "172.17.0.0/16"
        gateway: ""
        ipv4Prefix: "172.17."
        pciAddressPrefix: "0000:3a:"
      - subnet: "172.18.0.0/16"
        gateway: ""
        ipv4Prefix: "172.18."
        pciAddressPrefix: "0000:4d:"
      - subnet: "172.19.0.0/16"
        gateway: ""
        ipv4Prefix: "172.19."
        pciAddressPrefix: "0000:5d:"
      - subnet: "172.20.0.0/16"
        gateway: ""
        ipv4Prefix: "172.20."
        pciAddressPrefix: "0000:9b:"
      - subnet: "172.21.0.0/16"
        gateway: ""
        ipv4Prefix: "172.21."
        pciAddressPrefix: "0000:ba:"
      - subnet: "172.22.0.0/16"
        gateway: ""
        ipv4Prefix: "172.22."
        pciAddressPrefix: "0000:ca:"
      - subnet: "172.23.0.0/16"
        gateway: ""
        ipv4Prefix: "172.23."
        pciAddressPrefix: "0000:db:"
