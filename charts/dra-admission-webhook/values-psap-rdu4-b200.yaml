# PSAP RDU4 B200 cluster — Ethernet with pcieRoot rail matching
webhookConfig:
  maxPairsPerNUMA: 4
  maxPairsPerNode: 8
  gpuDeviceClassName: gpu.nvidia.com
  nicDeviceClassName: dranet
  preflightCheck: false
  nicConfig:
    mtu: 9000
    rdmaRequired: true
    interfacePrefix: "net"
    startingTableId: 100
    crossRailCIDR: "172.16.0.0/13"
    includeDevices:
      encapsulations:
        - "ether"
      sriov: true
    rails:
      - subnet: "172.16.0.0/16"
        gateway: "172.16.0.1"
        ipv4Prefix: "172.16."
      - subnet: "172.17.0.0/16"
        gateway: "172.17.0.1"
        ipv4Prefix: "172.17."
      - subnet: "172.18.0.0/16"
        gateway: "172.18.0.1"
        ipv4Prefix: "172.18."
      - subnet: "172.19.0.0/16"
        gateway: "172.19.0.1"
        ipv4Prefix: "172.19."
      - subnet: "172.20.0.0/16"
        gateway: "172.20.0.1"
        ipv4Prefix: "172.20."
      - subnet: "172.21.0.0/16"
        gateway: "172.21.0.1"
        ipv4Prefix: "172.21."
      - subnet: "172.22.0.0/16"
        gateway: "172.22.0.1"
        ipv4Prefix: "172.22."
      - subnet: "172.23.0.0/16"
        gateway: "172.23.0.1"
        ipv4Prefix: "172.23."
