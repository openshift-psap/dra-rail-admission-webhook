apiVersion: v1
kind: ConfigMap
metadata:
  name: dra-gpu-nic-webhook-config
  namespace: dra-webhook-system
data:
  config.yaml: |
    maxPairsPerNUMA: 4
    maxPairsPerNode: 8
    gpuDeviceClassName: gpu.nvidia.com
    nicDeviceClassName: dranet
    transportMode: auto
    nicConfig:
      mtu: 2044
      rdmaRequired: true
      interfacePrefix: "net"
      startingTableId: 100
      # IB rails: GPU+NIC PCIe address pairs from gpu-nic-pairing-map.sh
      # List index = rail index. NUMA 0: rails 0-3, NUMA 1: rails 4-7
      ibRails:
        - gpu: "0001:00:00.0"
          nic: "0101:00:00.0"
        - gpu: "0002:00:00.0"
          nic: "0102:00:00.0"
        - gpu: "0003:00:00.0"
          nic: "0103:00:00.0"
        - gpu: "0008:00:00.0"
          nic: "0104:00:00.0"
        - gpu: "0009:00:00.0"
          nic: "0105:00:00.0"
        - gpu: "000a:00:00.0"
          nic: "0106:00:00.0"
        - gpu: "000b:00:00.0"
          nic: "0107:00:00.0"
        - gpu: "000c:00:00.0"
          nic: "0108:00:00.0"
    preflightCheck: false
  reconciler.yaml: |
    # How often to check for orphaned resources
    interval: "5m"
    # Auto-delete orphaned resources after grace period
    autoReap: false
    # How long an orphan must be detected before auto-reaping
    gracePeriod: "10m"
    # How long to keep reaped records in state before pruning
    pruneAfter: "168h"
    # Path for persistent state file (must be on a PV)
    statePath: "/data/reconciler-state.json"
